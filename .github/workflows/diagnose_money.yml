name: Futmondo Diagnose Money Events

on:
  workflow_dispatch:

concurrency:
  group: futmondo-diagnose-money
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sync primero (datos frescos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.main

      - name: Diagnosticar Money Events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.diagnose_money

      - name: Auditoría de balance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.audit_balance
