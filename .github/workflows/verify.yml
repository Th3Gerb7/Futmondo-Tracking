name: Futmondo Verify

on:
  workflow_dispatch:
    inputs:
      run_sync_first:
        description: "Ejecutar sync antes de verificar"
        type: boolean
        default: false

concurrency:
  group: futmondo-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sync
        if: ${{ inputs.run_sync_first }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.main

      - name: Verificar PressRoom
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.verify_pressroom

      - name: Auditar balances
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.audit_balance
