name: Futmondo Recover

on:
  workflow_dispatch:

concurrency:
  group: futmondo-recover
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Insertar transacciones recuperadas manualmente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.insert_missing_tx

      - name: Diagnostico completo API vs Supabase por IDs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.diagnose_full

      - name: Diagnosticar transacciones faltantes por plantilla
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.diagnose_all_missing

      - name: Auditar balances
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FUTMONDO_EMAIL: ${{ secrets.FUTMONDO_EMAIL }}
          FUTMONDO_PASSWORD: ${{ secrets.FUTMONDO_PASSWORD }}
          CHAMPIONSHIP_ID: ${{ secrets.CHAMPIONSHIP_ID }}
        run: python -m src.audit_balance
